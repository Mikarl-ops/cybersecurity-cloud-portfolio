name: Security Scan and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python tests and Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run Bandit
        run: bandit -r google-cybersecurity cloud-security -ll

  terraform:
    name: Terraform format and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Check formatting
        run: terraform fmt -check -recursive cloud-security
      - name: Validate network baseline
        run: |
          terraform -chdir=cloud-security/secure-infrastructure init -backend=false -input=false
          terraform -chdir=cloud-security/secure-infrastructure validate -no-color
      - name: Validate canary example
        run: |
          terraform -chdir=cloud-security/threat-deception init -backend=false -input=false
          terraform -chdir=cloud-security/threat-deception validate -no-color

  checkov:
    name: Terraform security findings (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Checkov
        run: python -m pip install checkov
      - name: Report Terraform findings
        run: checkov -d cloud-security --framework terraform --soft-fail

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
