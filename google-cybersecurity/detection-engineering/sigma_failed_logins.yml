title: Detect Rapid Failed SSH Logins (Brute Force)
id: 5d1e2f3a-4b5c-6d7e-8f9a-0b1c2d3e4f5a
status: experimental
description: Detects multiple failed SSH authentication attempts from a single source IP within a short timeframe.
author: Security Portfolio
date: 2026/08/01
logsource:
  category: authentication
  product: linux
detection:
  selection:
    EventID: 4625
    Service: sshd
  timeframe: 5m
  condition: selection | count() by SourceIP > 5
falsepositives:
  - Misconfigured automated scripts or deployment keys
level: high
tags:
  - attack.t1110.001
  - attack.credential_access