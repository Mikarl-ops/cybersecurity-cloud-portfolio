title: Detect Rapid Failed Linux SSH Logins
id: 5d1e2f3a-4b5c-6d7e-8f9a-0b1c2d3e4f5a
status: experimental
description: Detect multiple failed SSH authentication attempts from one source within a short timeframe.
author: Mikael Beck
date: 2026/10/26
logsource:
  product: linux
  service: sshd
detection:
  selection:
    message|contains:
      - "Failed password for"
      - "Invalid user"
  timeframe: 5m
  condition: selection | count() by SourceIp > 5
falsepositives:
  - Misconfigured automated scripts or deployment keys
level: high
tags:
  - attack.t1110.001
  - attack.credential_access
